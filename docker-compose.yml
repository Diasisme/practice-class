services:
  php-webdev:
    build: ./docker/php
    container_name: php-webdev
    volumes:
      - ./app:/var/www/html
    tty: true
    networks:
      - webdev-network

  nginx-webdev:
    image: nginx:alpine
    container_name: nginx-webdev
    ports:
      - "8089:80"
    volumes:
      - ./app:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php-webdev
    networks:
      - webdev-network
      
  db-webdev:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password1
    ports:
      - "5430:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - webdev-network

networks:
  webdev-network:
    driver: bridge
    
volumes:
  db-data: